# Which provider adapters `ai-sdlc generate` emits, and where epics live.
providers:
  - claude
  - codex

backlog:
  kind: filesystem
  dir: .ai/epics

# Accepted lowering fidelities per capability. A set, not a threshold: advisory
# and broadened are different failure modes, so neither substitutes for the other.
requirements:
  codex:
    default: [native]
    # workspace-write cannot narrow to a path list, nor exclude paths, nor
    # remove shell or git. Each is prose on Codex; back them with CI or review.
    write_paths.allow: [native, broadened]
    write_paths.deny: [native, advisory]
    shell: [native, advisory]
    vcs_mutate: [native, advisory]

# This repo keeps the strict path: it ships the gate, so it is the one place the
# gate must actually run. `chat` is the default for consuming repos, not here.
approval:
  mode: artifact
  ci_gate: true
